[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paradox"
version = "1.0.0"
description = "Paradox — a graph-native autonomous detective agent on FalkorDB"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0",
    "falkordblite>=0.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6",
    "anthropic>=1.15",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["paradox*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
