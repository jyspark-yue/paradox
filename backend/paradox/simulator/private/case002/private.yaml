# SIMULATOR-PRIVATE — never seeded into the agent-readable graph or sent to the LLM.
case_id: case002

variants:
  A:
    id: A
    truth: HE
    narrative: >
      Esme used the lobby kiosk at 10:18 PM to encode a duplicate of Dmitri's archive
      credential, slipped out of the reading room, entered the archive at 10:40 with the clone,
      and swapped the page for a forgery printed on commercial paper she brought with her.
    outcomes:
      act_archive_door: dmitri_badge
      act_desk_camera: dmitri_present
      act_badge_audit: clone_detected
      act_kiosk_log: esme_session
      act_paper_analysis: external_stock
      act_greta_alibi: confirmed
      act_security_monitor: steady_monitoring
      act_hana: esme_left
      act_confront_dmitri: maintains_story
      act_confront_esme: revises_story
  B:
    id: B
    truth: HF
    narrative: >
      Felix paused the archive camera from his console at 10:35, used his own credential on the
      archive door at 10:40, and re-issued his badge afterwards to muddy the log.
    outcomes:
      act_archive_door: felix_badge
      act_desk_camera: dmitri_present
      act_badge_audit: felix_reissue
      act_kiosk_log: no_session
      act_paper_analysis: external_stock
      act_greta_alibi: confirmed
      act_security_monitor: camera_paused
      act_hana: esme_stayed
      act_confront_dmitri: maintains_story
      act_confront_esme: maintains_story

