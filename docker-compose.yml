services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"   # FalkorDB browser UI
    volumes:
      - falkordb-data:/var/lib/falkordb/data

  backend:
    build: ./backend
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      # Optional: enable the LLM policy
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - falkordb

  frontend:
    build: ./frontend
    environment:
      PARADOX_API_TARGET: http://backend:8000   # Vite proxies /api/* to the backend container
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  falkordb-data:
